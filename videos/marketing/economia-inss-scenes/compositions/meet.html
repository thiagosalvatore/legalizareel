<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":3.5},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1}]'>
  <body>
    <template id="meet-template">
      <style>
        #meet-root { position: absolute; inset: 0; }
        #meet-card { padding: 36px 56px; border: 0; }
        #meet-logo { display: block; width: 720px; }
      </style>
      <div id="meet-root" data-composition-id="meet" data-width="1080" data-height="1920">
        <div class="stage brand">
          <div class="center">
            <div class="card" id="meet-card"><img id="meet-logo" src="assets/brand/logo.png" alt="Legaliza Obra" /></div>
            <div class="big s110" id="meet-line">Reduza o INSS da obra em até <span class="hl">73%</span></div>
            <div class="badge" id="meet-badge">Dentro das regras da Receita</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          B.popIn(tl, "#meet-card", 0.05);
          B.upIn(tl, "#meet-line", 0.3 * dur);
          B.popIn(tl, "#meet-badge", 0.55 * dur);
          B.camera(tl, "meet", zoom, dur);
          window.__timelines["meet"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
