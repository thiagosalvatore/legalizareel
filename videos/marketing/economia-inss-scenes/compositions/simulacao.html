<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":5},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1}]'>
  <body>
    <template id="simulacao-template">
      <style>
        #simulacao-root { position: absolute; inset: 0; }
        #simulacao-head { position: absolute; top: 250px; left: 0; right: 0; z-index: 40; }
        #simulacao-screen { top: 520px; }
      </style>
      <div id="simulacao-root" data-composition-id="simulacao" data-width="1080" data-height="1920">
        <div class="stage surface">
          <img class="logo" id="simulacao-logo" src="assets/brand/logo.png" alt="Legaliza Obra" />
          <div class="center" id="simulacao-head">
            <div class="big s80">Resultado <span class="hl">na hora</span></div>
          </div>
          <div class="screen" id="simulacao-screen">
            <video id="simulacao-video" class="clip" src="assets/app/07-simulacao.mp4" data-start="0" data-media-start="4.8" muted playsinline></video>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          B.fadeIn(tl, "#simulacao-logo");
          B.upIn(tl, "#simulacao-head", 0.1);
          B.floatIn(tl, "#simulacao-screen", 0.2);
          tl.to("#simulacao-video", { scale: 1.3, x: -10, y: -420, duration: 0.9, ease: "power2.inOut" }, Math.max(3.4, 0.62 * dur));
          B.camera(tl, "simulacao", zoom, dur);
          window.__timelines["simulacao"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
