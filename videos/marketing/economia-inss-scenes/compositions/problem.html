<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":5},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1}]'>
  <body>
    <template id="problem-template">
      <style>
        #problem-root { position: absolute; inset: 0; }

      </style>
      <div id="problem-root" data-composition-id="problem" data-width="1080" data-height="1920">
        <div class="stage light">
          <img class="logo" id="problem-logo" src="assets/brand/logo.png" alt="Legaliza Obra" />
          <div class="center">
            <div class="badge" id="problem-badge">Casa de 240 m² em São Paulo</div>
            <div class="sub" id="problem-sub">INSS calculado pela área construída</div>
            <div class="money s180 hl-warn" id="problem-money">R$ 0</div>
            <div class="big s56" id="problem-line">Sem planejamento, a conta <span class="mark">vem alta</span>.</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          B.fadeIn(tl, "#problem-logo");
          B.upIn(tl, ["#problem-badge", "#problem-sub"], 0.1, 0.14);
          B.popIn(tl, "#problem-money", 0.2 * dur);
          B.counter(tl, "#problem-money", 81141, 0.2 * dur, 1.6);
          B.upIn(tl, "#problem-line", 0.55 * dur);
          B.camera(tl, "problem", zoom, dur);
          window.__timelines["problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
