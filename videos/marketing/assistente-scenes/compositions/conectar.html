<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":6},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1},{"id":"stepsAt","type":"string","label":"Each step lands (fractions)","default":"0.05,0.5"},{"id":"permitAt","type":"number","label":"Permitir clicked (fraction)","default":0.82},{"id":"doneAt","type":"number","label":"Conectado pops (fraction)","default":0.9}]'>
  <body>
    <template id="conectar-template">
      <style>
        #conectar-root { position: absolute; inset: 0; }
        #conectar-head { position: absolute; top: 150px; left: 140px; display: flex; align-items: center; gap: 32px; z-index: 20; }
        #conectar-chain { position: absolute; top: 380px; left: 140px; align-items: flex-start; z-index: 20; }
        #conectar-chain .step { width: 860px; font-size: 40px; box-shadow: 0 20px 40px rgba(16, 44, 41, .14); }
        #conectar-chain .link { margin-left: 82px; }
        #conectar-consent { left: 1120px; top: 330px; width: 660px; z-index: 30; }
        #conectar-consent .body { display: flex; flex-direction: column; gap: 26px; padding: 40px 44px 44px; }
        #conectar-consent h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; letter-spacing: -.02em; line-height: 1.15; }
        #conectar-consent p { margin: 0; font-size: 28px; line-height: 1.45; color: #636363; }
        #conectar-consent .buttons { display: flex; gap: 20px; margin-top: 10px; }
        #conectar-consent .buttons span { flex: 1; padding: 22px 0; border-radius: 16px; text-align: center; font-size: 32px; font-weight: 600; }
        #conectar-deny { border: 2px solid var(--divider); color: var(--ink); }
        #conectar-permit { background: var(--teal); color: var(--white); }
        #conectar-done { position: absolute; left: 1290px; top: 860px; z-index: 40; box-shadow: 0 20px 40px rgba(16, 44, 41, .2); }
      </style>
      <div id="conectar-root" data-composition-id="conectar" data-width="1920" data-height="1080">
        <div class="stage surface landscape">
          <img class="logo" id="conectar-logo" src="assets/brand/logo.png" alt="Legaliza Obra" />
          <div id="conectar-head">
            <div class="badge" id="conectar-badge">Passo 2 · no plugin</div>
            <div class="big s80" id="conectar-title">Conecte e <span class="hl">permita</span></div>
          </div>
          <div class="chain" id="conectar-chain">
            <div class="step conectar-step"><span class="num">1</span>Conectores → Conectar</div>
            <div class="link conectar-link"></div>
            <div class="step conectar-step"><span class="num">2</span>Entre e clique em Permitir</div>
          </div>
          <div class="window" id="conectar-consent">
            <div class="bar"><i></i><i></i><i></i><span>app.legalizaobra.com</span></div>
            <div class="body">
              <h3>Claude quer acessar sua conta Legaliza Obra</h3>
              <p>O assistente pede sua confirmação antes de enviar qualquer coisa ao eSocial ou de apagar dados.</p>
              <div class="buttons"><span id="conectar-deny">Negar</span><span id="conectar-permit">Permitir</span></div>
            </div>
          </div>
          <div class="status done" id="conectar-done">Conectado ✓</div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom, stepsAt, permitAt, doneAt } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          const steps = document.querySelectorAll(".conectar-step");
          const links = document.querySelectorAll(".conectar-link");
          const stepTimes = String(stepsAt).split(",").map((at) => Number(at) * dur);
          B.fadeIn(tl, "#conectar-logo");
          B.upIn(tl, ["#conectar-badge", "#conectar-title"], 0.05, 0.12);
          stepTimes.forEach((at, i) => {
            if (i > 0) B.drawLine(tl, links[i - 1], at - 0.3, 0.3);
            B.popIn(tl, steps[i], at);
          });
          B.floatIn(tl, "#conectar-consent", stepTimes.at(-1) + 0.2);
          tl.to("#conectar-permit", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, permitAt * dur);
          B.popIn(tl, "#conectar-done", doneAt * dur);
          B.camera(tl, "conectar", zoom, dur);
          window.__timelines["conectar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
