<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":5.5},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1},{"id":"menuAt","type":"number","label":"Menu item clicked (fraction)","default":0.38},{"id":"windowAt","type":"number","label":"Dialog opens (fraction)","default":0.5},{"id":"copyAt","type":"number","label":"Address copied (fraction)","default":0.82}]'>
  <body>
    <template id="copiar-template">
      <style>
        #copiar-root { position: absolute; inset: 0; }
        #copiar-text { position: absolute; left: 140px; top: 330px; width: 780px; display: flex; flex-direction: column; align-items: flex-start; gap: 36px; z-index: 20; }
        #copiar-menu { left: 1060px; top: 330px; width: 640px; }
        #copiar-menu .body { display: flex; flex-direction: column; gap: 8px; padding: 20px; }
        #copiar-menu .row { display: flex; align-items: center; gap: 20px; padding: 22px 26px; border-radius: 18px; font-size: 34px; font-weight: 500; color: var(--ink); }
        #copiar-menu .row.who { font-weight: 700; border-bottom: 1px solid var(--divider); border-radius: 0; }
        #copiar-menu .row i { width: 30px; height: 30px; border-radius: 8px; border: 3px solid currentColor; }
        #copiar-item { background: transparent; }
        #copiar-dialog { left: 960px; top: 300px; width: 840px; z-index: 40; }
        #copiar-dialog .body { display: flex; flex-direction: column; gap: 30px; padding: 40px 44px 48px; }
        #copiar-dialog h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 54px; letter-spacing: -.02em; }
        #copiar-dialog p { margin: 0; font-size: 30px; line-height: 1.45; color: #636363; }
        #copiar-dialog .input { justify-content: space-between; gap: 20px; padding-right: 12px; font-size: 34px; }
        #copiar-copy { padding: 12px 28px; border-radius: 12px; background: var(--teal); color: var(--white); font-size: 30px; font-weight: 600; }
        #copiar-copy .swap > * { white-space: nowrap; }
      </style>
      <div id="copiar-root" data-composition-id="copiar" data-width="1920" data-height="1080">
        <div class="stage surface landscape">
          <img class="logo" id="copiar-logo" src="assets/brand/logo.png" alt="Legaliza Obra" />
          <div id="copiar-text">
            <div class="badge" id="copiar-step">Passo 1 · no app</div>
            <div class="big s96" id="copiar-head">Copie o <span class="hl">endereço</span></div>
          </div>
          <div class="window" id="copiar-menu">
            <div class="body">
              <div class="row who">Construtora Horizonte</div>
              <div class="row" id="copiar-item"><i></i>Conectar ChatGPT ou Claude</div>
              <div class="row"><i></i>Sair</div>
            </div>
          </div>
          <div class="window" id="copiar-dialog">
            <div class="bar"><i></i><i></i><i></i><span>app.legalizaobra.com</span></div>
            <div class="body">
              <h3>Conectar ChatGPT ou Claude</h3>
              <p>Use o assistente para consultar e atualizar suas obras conversando. Copie o endereço abaixo e siga os passos.</p>
              <div class="field">
                <div class="input">https://api.legalizaobra.com/mcp<span id="copiar-copy"><span class="swap" id="copiar-swap"><span>Copiar</span><span>Copiado ✓</span></span></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom, menuAt, windowAt, copyAt } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          B.fadeIn(tl, "#copiar-logo");
          B.upIn(tl, ["#copiar-step", "#copiar-head"], 0.1, 0.15);
          B.floatIn(tl, "#copiar-menu", 0.2);
          tl.to("#copiar-item", { backgroundColor: "#daf5cb", color: "#1f514c", duration: 0.2, ease: "power1.out" }, menuAt * dur - 0.25);
          tl.to("#copiar-item", { scale: 0.96, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, menuAt * dur);
          tl.to("#copiar-menu", { opacity: 0, y: 40, duration: 0.3, ease: "power2.in" }, windowAt * dur);
          B.popIn(tl, "#copiar-dialog", windowAt * dur);
          tl.to("#copiar-copy", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, copyAt * dur);
          B.swapText(tl, "#copiar-swap", copyAt * dur);
          B.camera(tl, "copiar", zoom, dur);
          window.__timelines["copiar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
