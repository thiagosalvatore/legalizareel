<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":6.6},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1},{"id":"chatAt","type":"number","label":"Chat opens in the clip (s)","default":1.85},{"id":"allowAt","type":"number","label":"Allow once clicked (s)","default":5.25}]'>
  <body>
    <template id="pedido-template">
      <style>
        #pedido-root { position: absolute; inset: 0; }
        #pedido-head { position: absolute; top: 60px; left: 0; right: 0; z-index: 40; }
        #pedido-screen { top: 200px; background: #141414; }
        #pedido-badge { position: absolute; right: 120px; bottom: 90px; z-index: 45; box-shadow: 0 20px 40px rgba(16, 44, 41, .3); }
      </style>
      <div id="pedido-root" data-composition-id="pedido" data-width="1920" data-height="1080">
        <div class="stage deep landscape">
          <div class="logo-pill" id="pedido-logo"><img src="assets/brand/logo.png" alt="Legaliza Obra" /></div>
          <div class="center" id="pedido-head">
            <div class="big s80">Você pede. <span class="hl">O Claude faz.</span></div>
          </div>
          <div class="screen wide" id="pedido-screen">
            <video id="pedido-video" class="clip" src="assets/app/pedido-cut.mp4" data-start="0" data-media-start="0" muted playsinline></video>
          </div>
          <div class="badge" id="pedido-badge">Você autoriza cada ação</div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom, chatAt, allowAt } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          B.fadeIn(tl, "#pedido-logo");
          B.upIn(tl, "#pedido-head", 0.05);
          B.floatIn(tl, "#pedido-screen", 0.05);
          tl.set("#pedido-video", { scale: 2.2, x: -882, y: -479 }, 0);
          tl.set("#pedido-video", { scale: 1.86, x: -664, y: -238 }, chatAt);
          tl.fromTo("#pedido-screen", { scale: 1.03 }, { scale: 1, duration: 0.25, ease: "power2.out" }, chatAt);
          tl.to("#pedido-video", { scale: 2.05, x: -760, y: -350, duration: allowAt - chatAt, ease: "sine.inOut" }, chatAt);
          B.popIn(tl, "#pedido-badge", allowAt);
          B.camera(tl, "pedido", zoom, dur);
          window.__timelines["pedido"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
