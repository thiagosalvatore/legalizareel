<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":5.5},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1},{"id":"stepsAt","type":"string","label":"Each step lights up (fractions)","default":"0.22,0.42,0.6,0.78"}]'>
  <body>
    <template id="fluxo-template">
      <style>
        #fluxo-root { position: absolute; inset: 0; }
        #fluxo-chain .step { opacity: .35; }
        #fluxo-data {
          position: absolute; top: 0; right: 36px; z-index: 5; padding: 12px 24px; border-radius: 18px;
          background: var(--teal); color: var(--white); font-size: 28px; font-weight: 600; line-height: 1.3; text-align: right;
        }
        #fluxo-data b { display: block; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--mint-2); }
      </style>
      <div id="fluxo-root" data-composition-id="fluxo" data-width="1080" data-height="1920">
        <div class="stage brand">
          <div class="logo-pill" id="fluxo-logo"><img src="assets/brand/logo.png" alt="Legaliza Obra" /></div>
          <div class="center">
            <div class="big s96" id="fluxo-title">Tudo num <span class="hl">fluxo só</span></div>
            <div class="chain" id="fluxo-chain">
              <div class="step" id="fluxo-step-0"><span class="num">1</span>Simulação</div>
              <div class="link" id="fluxo-link-1"></div>
              <div class="step" id="fluxo-step-1"><span class="num">2</span>Orçamento</div>
              <div class="link" id="fluxo-link-2"></div>
              <div class="step" id="fluxo-step-2"><span class="num">3</span>Contrato</div>
              <div class="link" id="fluxo-link-3"></div>
              <div class="step" id="fluxo-step-3"><span class="num">4</span>Obra</div>
              <div id="fluxo-data">Maria Ferreira<b>R$ 18.500</b></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom, stepsAt } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          const STEPS_AT = String(stepsAt).split(",").map(Number);
          const TRAVEL = 0.35;

          B.fadeIn(tl, "#fluxo-logo");
          B.upIn(tl, "#fluxo-title", 0.1);
          B.upIn(tl, "#fluxo-chain", 0.25);

          const chip = document.getElementById("fluxo-data");
          STEPS_AT.forEach((fraction, i) => {
            const at = fraction * dur;
            const step = document.getElementById(`fluxo-step-${i}`);
            const landing = step.offsetTop + (step.offsetHeight - chip.offsetHeight) / 2;
            if (i === 0) {
              tl.set(chip, { y: landing }, 0);
              B.popIn(tl, chip, at);
            } else {
              B.drawLine(tl, `#fluxo-link-${i}`, at - TRAVEL, TRAVEL);
              tl.to(chip, { y: landing, duration: TRAVEL, ease: "power2.inOut" }, at - TRAVEL);
            }
            tl.to(step, { opacity: 1, duration: 0.2 }, at);
            tl.fromTo(step, { scale: 1 }, { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.out" }, at);
          });

          B.camera(tl, "fluxo", zoom, dur);
          window.__timelines["fluxo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
