<!doctype html>
<html data-composition-variables='[{"id":"dur","type":"number","label":"Scene length (s)","default":7.3},{"id":"zoom","type":"number","label":"Camera push (1 = none)","default":1},{"id":"badgeAt","type":"number","label":"Badge pops (fraction)","default":0.4},{"id":"cutsAt","type":"string","label":"Cuts in the clip (s)","default":"2"}]'>
  <body>
    <template id="orcamento-template">
      <style>
        #orcamento-root { position: absolute; inset: 0; }
        #orcamento-head { position: absolute; top: 250px; left: 0; right: 0; z-index: 40; }
        #orcamento-screen { top: 520px; }
        #orcamento-badge { position: absolute; top: 1380px; left: 0; right: 0; margin: 0 auto; width: fit-content; z-index: 45; box-shadow: 0 20px 40px rgba(16, 44, 41, .2); }
      </style>
      <div id="orcamento-root" data-composition-id="orcamento" data-width="1080" data-height="1920">
        <div class="stage surface">
          <img class="logo" id="orcamento-logo" src="assets/brand/logo.png" alt="Legaliza Obra" />
          <div class="center" id="orcamento-head">
            <div class="big s80">Orçamento <span class="hl">em um clique</span></div>
          </div>
          <div class="screen" id="orcamento-screen">
            <video id="orcamento-video" class="clip" src="assets/app/orcamento-cut.mp4" data-start="0" data-media-start="0" muted playsinline></video>
          </div>
          <div class="badge" id="orcamento-badge">Com os números da simulação</div>
        </div>
      </div>
      <script>
        (() => {
          const { dur, zoom, badgeAt, cutsAt } = window.__hyperframes.getVariables();
          const tl = gsap.timeline({ paused: true });
          const B = window.brand;
          const [cut] = String(cutsAt).split(",").map(Number);
          B.fadeIn(tl, "#orcamento-logo");
          B.upIn(tl, "#orcamento-head", 0.1);
          B.floatIn(tl, "#orcamento-screen", 0.1);
          tl.set("#orcamento-video", { scale: 1.06, x: -70, y: 0 }, 0);
          tl.set("#orcamento-video", { scale: 1.42, x: -55, y: 0 }, cut);
          tl.fromTo("#orcamento-screen", { scale: 1.04 }, { scale: 1, duration: 0.25, ease: "power2.out" }, cut);
          B.popIn(tl, "#orcamento-badge", badgeAt * dur);
          B.camera(tl, "orcamento", zoom, dur);
          window.__timelines["orcamento"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
